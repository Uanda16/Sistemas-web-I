<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica PHP</title>
</head>
<body>

    <h2>Calculadora Básica</h2>

    <form action="executa.php" method="POST">
        
        <label for="num1">Primeiro Número:</label><br>
        <input type="number" id="num1" name="num1" required>
        <br>
        <label for="num2">Segundo Número:</label><br>
        <input type="number" id="num2" name="num2" required>

        <label for="operacao">Operação:</label><br>
        <select id="operacao" name="operacao" required>
            <option value="1">Adição</option>
            <option value="2">Subtração</option>
            <option value="3">Multiplicação</option>
            <option value="4">Divisão</option>
            <option value="5">Exponenciação</option>
        </select>
        <button type="submit">Calcular</button>
        
    </form>

</body>
</html>
