<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
</head>
<body>

    <h2>Gerenciador de Produtos</h2>

    <form action="controller.php" method="post">

        <label for="prod">Nome do Produto: </label>
        <input type="text" id="prod" name="prod" required>
        <br>
        <br>
        <label for="precoUni">Preço Unitário: </label>
        <input type="number" id="precoUni" name="precoUni" required> <!--NÃO DEIXA COLOCAR NÚMERO COM VÍRGULA!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!-->
        <br>
        <br>
        <label for="qtnd">Quantidade: </label>
        <input type="text" id="qtnd" name="qtnd" required>
        <br>
        <br>
        <label for="desc">Desconto Aplicado: </label>
        <input type="number" id="desc" name="desc" required>
        <br>
        <br>
        <label for="estoque">Qtd em estoque: </label>
        <input type="number" id="estoque" name="estoque" required>
        <br>
        <br>
        <button type="submit">Calcular</button>

    </form>
   
</body>
</html>
